# Variables are interpolated from .env next to this file (Compose loads it automatically).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ['--api-key', '${TYPESENSE_API_KEY}', '--data-dir', '/data']
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - typesense-data:/data

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  localstack-data:
  typesense-data:
