# Production stack on the VPS. CI writes .env next to this file from GitHub environment vars/secrets
# (hosts must be service names: POSTGRES_HOST=postgres, REDIS_HOST=redis, RABBITMQ_URL=amqp://u:p@rabbitmq:5672,
# TYPESENSE_URL=http://typesense:8108). S3 and SMTP are external providers in production.
services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    # Reached by the VPS's shared nginx container as http://athena-api:${PORT}; no host port is published.
    networks:
      default:
      proxy-network:
        aliases: [athena-api]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      typesense:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ['--api-key', '${TYPESENSE_API_KEY}', '--data-dir', '/data']
    volumes:
      - typesense-data:/data

networks:
  proxy-network:
    external: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  typesense-data:
